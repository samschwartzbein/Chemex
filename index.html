<title>Chemex</title>
<style>
  :root{
    --bg:#231812; --ink:#F5EBDD; --muted:#A8917B; --honey:#F0B44C;
    --line:rgba(245,235,221,.12); --glow:rgba(240,180,76,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);height:100%}
  body{
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
    display:flex;flex-direction:column;min-height:100%;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 12px}
  h1{font-size:1.65rem;font-weight:700;letter-spacing:-.01em}
  .ratio{font-size:1.05rem;color:var(--muted);font-weight:500}
  .ratio b{color:var(--ink);font-weight:700}

  ol{list-style:none;flex:1;display:flex;flex-direction:column}
  li{
    display:grid;grid-template-columns:5.6rem 1fr auto;align-items:center;gap:.5rem;
    padding:.72rem 6px;border-top:1px solid var(--line);
    border-radius:14px;transition:background .25s, opacity .25s;
  }
  li:first-child{border-top:0}
  .t{font-size:1.02rem;color:var(--muted);line-height:1.15;font-weight:600}
  .t span{display:block}
  .name{font-size:1.45rem;font-weight:600}
  .g{font-size:2.15rem;font-weight:800;color:var(--honey);letter-spacing:-.02em;line-height:1}
  .g small{font-size:1rem;font-weight:600;margin-left:2px;color:var(--honey);opacity:.75}
  li.wait .name{color:var(--muted);font-weight:500}

  body.running li{opacity:.4}
  body.running li.now{opacity:1;background:var(--glow);border-top-color:transparent}
  body.running li.now + li{border-top-color:transparent}
  body.running li.done{opacity:.22}

  .timer{
    margin-top:12px;width:100%;border:0;border-radius:20px;
    background:var(--ink);color:var(--bg);font:inherit;
    font-size:1.35rem;font-weight:700;padding:1.05rem;cursor:pointer;
    display:flex;justify-content:center;align-items:baseline;gap:.6rem;
  }
  .timer .clock{font-size:1.9rem;font-weight:800;display:none}
  body.running .timer{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
  body.running .timer .clock{display:inline}
  body.running .timer .lbl{font-size:1rem;color:var(--muted);font-weight:600}
  .timer:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){li{transition:none}}
</style>
</head>
<body>
  <header>
    <h1>Chemex</h1>
    <div class="ratio"><b>40</b> g coffee, <b>666</b> g water</div>
  </header>

  <ol id="steps">
    <li data-s="0"><div class="t"><span>0:00</span><span>0:15</span></div><div class="name">Bloom</div><div class="g">110<small>g</small></div></li>
    <li data-s="15" class="wait"><div class="t"><span>0:15</span><span>0:45</span></div><div class="name">Bloom rest</div><div></div></li>
    <li data-s="45"><div class="t"><span>0:45</span><span>1:30</span></div><div class="name">Pour</div><div class="g">300<small>g</small></div></li>
    <li data-s="90" class="wait"><div class="t"><span>1:30</span><span>2:05</span></div><div class="name">Draw down</div><div></div></li>
    <li data-s="125"><div class="t"><span>2:05</span><span>2:45</span></div><div class="name">Pour</div><div class="g">480<small>g</small></div></li>
    <li data-s="165" class="wait"><div class="t"><span>2:45</span><span>3:20</span></div><div class="name">Draw down</div><div></div></li>
    <li data-s="200"><div class="t"><span>3:20</span><span>4:00</span></div><div class="name">Pour</div><div class="g">666<small>g</small></div></li>
    <li data-s="240" class="wait"><div class="t"><span>~5:00</span><span>5:45</span></div><div class="name">Finish</div><div></div></li>
  </ol>

  <button class="timer" id="timer" type="button">
    <span class="clock" id="clock">0:00</span><span class="lbl" id="lbl">Start timer</span>
  </button>

<script>
  const body=document.body, rows=[...document.querySelectorAll('#steps li')];
  const clock=document.getElementById('clock'), lbl=document.getElementById('lbl');
  let start=null, tick=null, lock=null;

  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

  function render(){
    const s=Math.floor((Date.now()-start)/1000);
    clock.textContent=fmt(s);
    let cur=0;
    rows.forEach((r,i)=>{ if(s>=+r.dataset.s) cur=i; });
    rows.forEach((r,i)=>{
      r.classList.toggle('now',i===cur);
      r.classList.toggle('done',i<cur);
    });
  }

  async function keepAwake(){
    try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){}
  }

  document.getElementById('timer').addEventListener('click',()=>{
    if(start===null){
      start=Date.now(); body.classList.add('running'); lbl.textContent='Tap to reset';
      render(); tick=setInterval(render,250); keepAwake();
    }else{
      clearInterval(tick); start=null; body.classList.remove('running');
      rows.forEach(r=>r.classList.remove('now','done'));
      clock.textContent='0:00'; lbl.textContent='Start timer';
      if(lock){lock.release().catch(()=>{}); lock=null;}
    }
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && start!==null){ render(); keepAwake(); }
  });
</script>
</body>
</html>
